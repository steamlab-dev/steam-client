services:
  socks5:
    image: serjs/go-socks5-proxy@sha256:0af522996f402c03ecd985a87997158eabeb28935365e3a384df37eafcf740ea
    environment:
      PROXY_USER: integration_user
      PROXY_PASSWORD: integration_pass
    ports:
      - "19080:1080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  squid:
    image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    command: ["-N", "-f", "/etc/squid/squid.conf"]
    stop_grace_period: 1s
    ports:
      - "19128:3128"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./squid/squid.conf:/etc/squid/squid.conf:ro

  squid-auth:
    image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    command: ["-N", "-f", "/etc/squid/squid.conf"]
    stop_grace_period: 1s
    ports:
      - "19129:3128"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./squid/squid-auth.conf:/etc/squid/squid.conf:ro
      - ./squid/users.htpasswd:/etc/squid/users.htpasswd:ro
